<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miner.AI - Extracție de date imobiliare</title>
    <meta name="description" content="Extracție de date imobiliare asistată de AI. Transformă URL-urile anunțurilor în date structurate și categorisite automat." />
    <meta property="og:title" content="Miner.AI" />
    <meta property="og:description" content="Extracție de date imobiliare asistată de AI." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" />
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/neue-montreal" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#111827" />
    <script>
      // Filter out uncaught errors and rejections originating from third-party browser extensions (e.g. MetaMask inpage.js)
      window.addEventListener('error', function(event) {
        if (
          (event.filename && event.filename.includes('chrome-extension://')) ||
          (event.message && (
            event.message.includes('MetaMask') || 
            event.message.includes('Failed to connect to MetaMask') ||
            event.message.includes('nkbihfbeogaeaoehlefnkodbefgpgknn')
          ))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var message = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          message.includes('MetaMask') || 
          message.includes('chrome-extension://') || 
          message.includes('nkbihfbeogaeaoehlefnkodbefgpgknn')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
